<title>kebabrahsyah | Kebab, Roti Canai, Burger</title>

<style>
:root{
  --in:#c2410c; --mid:#7c2d12; --out:#1c0a04;
  --bread:#f2c777; --bread2:#d99a45; --fill:#e8d9b5; --sauce:#fff7e6;
  --pink:#fbcfe8; --ink:#2a0f05; --muted:rgba(255,255,255,.72);
  --font-h:'Galada',cursive; --font-b:'Inter',system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:inherit}
html,body{height:100%}
body{
  background:radial-gradient(circle at center,var(--in) 0%,var(--mid) 50%,var(--out) 100%);
  color:#fff;font-family:var(--font-b);overflow:hidden;
}
body.beef{--bread:#e0a85c;--bread2:#b97a35;--fill:#8a4b32;--sauce:#f3e3c3}

#steam{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.puff{position:absolute;bottom:-60px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 70%);
  animation:rise linear forwards}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.5}100%{transform:translate(40px,-115vh) scale(1.6);opacity:0}}

header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:100;display:flex;
  justify-content:space-between;align-items:center;padding:1.5rem 4%}
.logo{font-family:var(--font-h);font-size:1.6rem}
nav{display:flex;gap:.4rem;padding:.4rem;border-radius:100px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
nav a{color:var(--muted);text-decoration:none;font-size:.85rem;padding:.5rem 1.1rem;border-radius:100px;transition:.3s}
nav a:hover,nav a.on{background:var(--pink);color:var(--ink)}
.contact{background:rgba(0,0,0,.5);color:#fff;border:0;padding:.85rem 1.8rem;border-radius:100px;font-weight:600;cursor:pointer;transition:.3s}
.contact:hover{background:rgba(0,0,0,.7);transform:translateY(-2px)}

main{position:relative;height:100%;display:flex;justify-content:space-between;align-items:stretch;padding:5rem 4% 0}
.left,.right{position:relative;z-index:30;display:flex;flex-direction:column;padding:6rem 0;height:100%}
.left{gap:1.8rem}
.right{align-items:flex-end;text-align:right;justify-content:space-between;width:450px;pointer-events:none}
h1,h2{font-family:var(--font-h);font-weight:400;font-size:clamp(4rem,10vw,11rem);line-height:.8;white-space:nowrap}
.outline{-webkit-text-stroke:2px #fff;color:transparent}
.desc{color:var(--muted);font-size:.98rem;line-height:1.6;max-width:470px;text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto;word-spacing:-.03em}
.cta{display:flex;align-items:center;gap:1.4rem;background:rgba(0,0,0,.5);color:#fff;border:0;border-radius:100px;
  padding:.4rem .4rem .4rem 1.5rem;font-weight:600;cursor:pointer;width:fit-content;transition:.3s}
.cta:hover{background:rgba(0,0,0,.7);transform:translateY(-3px)}
.cta i{font-style:normal;width:38px;height:38px;border-radius:50%;background:var(--pink);color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:900}
.badge{margin-top:auto;display:flex;gap:1rem;align-items:center}
.badge b{display:block;font-size:.7rem;letter-spacing:.08em;color:var(--muted);font-weight:600}
.badge span{font-size:.85rem;font-weight:600}
.badge .ic{width:48px;height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:1.4rem}

.stage{position:absolute;inset:0;display:grid;place-items:center;z-index:10;pointer-events:none;
  opacity:0;animation:fadeIn 1.5s ease-out .3s forwards,bob 6s ease-in-out infinite}
@keyframes fadeIn{to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.persp{perspective:1200px}
#wrap{width:min(46vh,340px);aspect-ratio:200/360;transform-style:preserve-3d;transform:rotate(0deg);
  filter:drop-shadow(0 30px 40px rgba(0,0,0,.45));will-change:transform}
#wrap svg{width:100%;height:100%;display:block;overflow:visible}

.layer{position:absolute;inset:0;pointer-events:none;transition:transform .1s ease-out}
#fg{z-index:40}#bg{z-index:5}
.top{position:absolute;font-size:2.4rem;line-height:1;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));will-change:transform}

.cards{display:flex;gap:1rem;pointer-events:auto;margin-top:2.5rem}
.card{width:128px;padding:1rem;padding-top:4rem;border-radius:28px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;flex-direction:column;align-items:center;gap:1rem;cursor:pointer;position:relative;
  transition:all .4s cubic-bezier(.175,.885,.32,1.275);text-align:center;font:inherit;color:inherit}
.card:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4)}
.card.on{border-color:var(--pink)}
.card .mini{width:70px;height:126px;margin-top:-6.5rem;transition:transform .5s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 18px 24px rgba(0,0,0,.45))}
.card:hover .mini{transform:translateY(-20px) rotate(-10deg) scale(1.12)}
.card .mini svg{width:100%;height:100%;overflow:visible}
.card span{display:block;font-size:.72rem}.card span:first-of-type{font-weight:600}.card span+span{color:var(--muted)}
.card:focus-visible,.cta:focus-visible,.contact:focus-visible,nav a:focus-visible{outline:2px solid var(--pink);outline-offset:3px}

@media (max-width:1200px){
  h1,h2{font-size:clamp(3rem,12vw,5rem)}
  main{padding:5rem 5% 0}
  .right{width:auto}
  .desc{display:none}
  nav{display:none}
}
@media (max-width:700px){
  .cards{gap:.6rem}.card{width:120px}
  .badge{display:none}
}
@media (prefers-reduced-motion:reduce){.puff{display:none}.stage{animation:fadeIn 1s forwards}}

/* ===== Responsif: Android, iPhone, tablet ===== */
html,body{-webkit-text-size-adjust:100%;touch-action:none}
@supports (height:100dvh){html,body{height:100dvh}}
main{padding-left:max(4%,env(safe-area-inset-left,0px));padding-right:max(4%,env(safe-area-inset-right,0px))}
@media (max-width:1200px){.card{width:112px}.right{width:auto}}
@media (hover:none){
  .card:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
  .card.on:hover{border-color:var(--pink)}
  .card:hover .mini{transform:none}
  .cta:hover,.contact:hover{transform:none}
}
/* HP potret & layar sempit */
@media (max-width:900px) and (orientation:portrait),(max-width:520px){
  header{padding:1rem 5%}
  .logo{font-size:1.35rem}
  .contact{padding:.65rem 1.1rem;font-size:.8rem}
  main{flex-direction:column;justify-content:flex-start;
    padding:4.6rem max(5%,env(safe-area-inset-right,0px)) 1rem max(5%,env(safe-area-inset-left,0px))}
  .left{height:auto;padding:1rem 0 0;gap:1rem;align-items:center;text-align:center}
  .right{width:100%;height:auto;margin-top:auto;padding:0;gap:.8rem;flex-direction:column-reverse;
    justify-content:flex-end;align-items:center;text-align:center}
  h1 br,h2 br{display:none}
  .outline::after{content:" ";-webkit-text-stroke:0}
  h1{font-size:clamp(2.6rem,12.5vw,4.6rem)}
  h2{font-size:clamp(1.9rem,8.6vw,3.2rem);line-height:1}
  .side-title{align-self:center;text-align:center}
  .cards{margin-top:2.2rem;gap:.6rem;justify-content:center;width:100%}
  .card{width:calc((90vw - 1.2rem)/3);padding:.8rem .4rem;padding-top:3rem;gap:.8rem;border-radius:22px}
  .card .mini{width:58px;height:104px;margin-top:-5rem}
  .card span{font-size:.7rem}
  #wrap{width:min(48vw,27vh)}
}
@media (max-height:700px) and (orientation:portrait){h2{display:none}}
/* HP landscape */
@media (max-height:520px) and (orientation:landscape){
  header{padding:.7rem 4%}
  main{padding-top:3.6rem}
  .left,.right{padding:.8rem 0}
  .left{gap:.8rem}
  h1{font-size:clamp(2.4rem,9vh,3.4rem)}
  .badge,.desc,h2{display:none}
  .right{justify-content:center}
  .cards{margin-top:2rem;gap:.5rem}
  .card{width:92px;padding:.6rem .4rem;padding-top:2.4rem;gap:.6rem}
  .card .mini{width:46px;height:83px;margin-top:-3.8rem}
  #wrap{width:min(40vh,300px)}
}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 1.2rem);transform:translate(-50%,20px);
  z-index:300;max-width:88vw;padding:.8rem 1.3rem;border-radius:100px;background:rgba(0,0,0,.75);color:#fff;
  font-size:.85rem;text-align:center;opacity:0;pointer-events:none;transition:.35s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
a.contact{display:inline-block;text-decoration:none;font-family:inherit;font-size:.85rem;line-height:1.2}
.cta i img{width:24px;height:24px;display:block}


/* HP potret: tombol Pesan Sekarang di paling bawah */
@media (max-width:900px) and (orientation:portrait),(max-width:520px){
  main{align-items:center;gap:.8rem}
  .left{display:contents}
  .left h1{order:1;margin-top:.6rem;position:relative;z-index:100}
  .right{order:2;margin-top:auto}
  .cta{order:3;width:min(100%,340px);justify-content:space-between;position:relative;z-index:100}
  .badge{display:none}
}
@media (max-height:700px) and (orientation:portrait){
  .card{padding-top:2.4rem}
  .card .mini{width:46px;height:83px;margin-top:-4rem}
  .cards{margin-top:1.8rem}
}

/* HP potret: rapatkan judul-gambar, tombol ringkas di tengah */
@media (max-width:900px) and (orientation:portrait),(max-width:520px){
  main{padding-top:4.3rem}
  .left h1{margin-top:.2rem}
  .stage{inset:auto 0 auto 0;top:var(--stage-top,clamp(15rem,32vh,19rem));height:0;display:flex;align-items:center;justify-content:center}
  .cta{width:fit-content;justify-content:flex-start;gap:1rem;align-self:center}
  #wrap{width:var(--wrap-w,min(48vw,27vh))}
}

/* Ikon makanan di dalam kartu */
.cards{margin-top:0}
.card{padding:.9rem .6rem .8rem;gap:.6rem}
.card .mini{width:56px;height:100px;margin-top:0;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
.card:hover .mini{transform:translateY(-3px) rotate(-8deg) scale(1.08)}
@media (hover:none){.card:hover .mini{transform:none}}
@media (max-height:700px) and (orientation:portrait){.card .mini{width:46px;height:83px}}
@media (max-height:520px) and (orientation:landscape){.card{padding:.6rem .4rem}.card .mini{width:44px;height:80px}}
</style>

      <button class="card" data-flavor="kebab"><div class="mini"><svg><use href="#kebabSvg"/></svg></div><div><span>Roti Canai</span><span>Rp 10.000</span></div></button>
      <button class="card" data-flavor="burger"><div class="mini"><svg><use href="#burgerSvg"/></svg></div><div><span>Burger</span><span>Rp 10.000</span></div></button>
    </div>
    <h2><span class="outline">Dietnya</span><br>Besok Aja!</h2>
  </div>
</main>

<script>
/* Ganti ke gambar/GLB sendiri nanti. Kosong = pakai gambar SVG bawaan. */
/* Isi dengan link pemesanan (WhatsApp, Google Form, GoFood, dll.) */
const ORDER_URL='https://wa.me/628986063500?text='+encodeURIComponent('Halo KebabRahsyah, saya mau pesan');
const toastEl=document.getElementById('toast');let toastT;
function order(){
  if(ORDER_URL){window.open(ORDER_URL,'_blank','noopener');return}
  toastEl.textContent='Link pemesanan belum diisi';toastEl.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),2200);
}
document.querySelectorAll('.cta').forEach(b=>b.addEventListener('click',order));
const TILT={shawarma:0,kebab:18,burger:18};
const SYM={shawarma:'wrapSvg',kebab:'kebabSvg',burger:'burgerSvg'};
const SET = {
  shawarma:{toppings:['🍅','🥬','🧅','🥒','🍋','🌿','🍅','🥬','🧅'],theme:{in:'#c2410c',mid:'#7c2d12',out:'#1c0a04'}},
  kebab:{toppings:['🌶️','🫑','🧅','🍅','🍋','🌿','🌶️','🫑','🧅'],theme:{in:'#9f1239',mid:'#4c0519',out:'#14040a'}},
  burger:{toppings:['🍅','🥬','🧅','🧀','🥒','🍟','🍅','🥬','🧅'],theme:{in:'#a16207',mid:'#5b3410',out:'#170e04'}}
};
const POS=[[25,30,2.6],[60,42,1.6],[30,62,3],[15,48,2],[75,20,1.8],[45,75,2.4],[15,40,1.3],[50,55,1.1],[80,35,1.2]];
const fg=document.getElementById('fg'), bg=document.getElementById('bg'), wrap=document.getElementById('wrap');
const stage=document.querySelector('.stage'), body=document.body, root=document.documentElement;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let switching=false, spin=0, tilt=0;

const K=Math.min(1,Math.max(.55,innerWidth/900));
const coarse=matchMedia('(pointer:coarse)').matches;
let lastMove=0;
const tops=[];
POS.forEach((p,i)=>{
  const el=document.createElement('div'); el.className='top';
  el.textContent=SET.shawarma.toppings[i];
  el.style.top=p[0]+'%'; el.style.left=p[1]+'%'; el.style.fontSize=(p[2]*K)+'rem';
  if(i>=6){el.style.opacity=.65; bg.appendChild(el)} else fg.appendChild(el);
  el.dataset.rx=0; el.dataset.ry=0; el.dataset.angle=Math.random()*360; el.dataset.bx=0; el.dataset.by=0;
  tops.push(el);
});

let mouse={x:0,y:0,px:-999,py:-999}, cur={x:0,y:0};
const track=e=>{lastMove=performance.now();mouse.x=e.clientX/innerWidth-.5;mouse.y=e.clientY/innerHeight-.5;mouse.px=e.clientX;mouse.py=e.clientY};
addEventListener('pointermove',track);
addEventListener('pointerdown',track);
const release=e=>{if(e.pointerType!=='mouse'){mouse.px=-999;mouse.py=-999}};
addEventListener('pointerup',release);addEventListener('pointercancel',release);

const DUR=[5,7,6,8,5.5,6.5,9,11,10];
(function loop(){
  const t=Date.now()*.001;
  if(coarse&&performance.now()-lastMove>1500){mouse.x=Math.sin(t*.7)*.35;mouse.y=Math.cos(t*.5)*.12;mouse.px=-999;mouse.py=-999}
  cur.x+=(mouse.x-cur.x)*.05; cur.y+=(mouse.y-cur.y)*.05;
  wrap.style.transform=`rotate(${tilt}deg) rotateY(${cur.x*40+spin}deg) rotateX(${-cur.y*20}deg)`;
  fg.style.transform=`translate(${cur.x*60}px,${cur.y*60}px)`;
  bg.style.transform=`translate(${cur.x*-30}px,${cur.y*-30}px)`;
  if(!switching){
    tops.forEach((el,i)=>{
      const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
      const dx=mouse.px-cx, dy=mouse.py-cy, d=Math.hypot(dx,dy)||1;
      let tx=0,ty=0,sm=1;
      if(d<400){const f=(400-d)/400; tx=dx/d*f*-80; ty=dy/d*f*-80; sm=1+f*5}
      let rx=+el.dataset.rx, ry=+el.dataset.ry, a=+el.dataset.angle;
      rx+=(tx-rx)*.1; ry+=(ty-ry)*.1; a+=.2*sm;
      el.dataset.rx=rx; el.dataset.ry=ry; el.dataset.angle=a;
      const ph=(t+i*.7)*(Math.PI*2/DUR[i]);
      el.style.transform=`translate(${rx+ +el.dataset.bx}px,${ry+ +el.dataset.by+Math.sin(ph)*15}px) rotate(${a+Math.cos(ph)*6}deg)`;
    });
  }
  requestAnimationFrame(loop);
})();

function switchFlavor(key){
  if(switching) return; switching=true;
  const s=SET[key];
  gsap.to(root,{'--in':s.theme.in,'--mid':s.theme.mid,'--out':s.theme.out,duration:1.5,ease:'power2.inOut'});
  const o={v:0,b:0};
  gsap.to(o,{v:360,b:15,duration:.6,ease:'power2.in',
    onUpdate:()=>{spin=o.v;wrap.style.filter=`blur(${o.b}px) drop-shadow(0 30px 40px rgba(0,0,0,.45))`},
    onComplete:()=>{
      document.getElementById('mainUse').setAttribute('href','#'+SYM[key]);tilt=TILT[key];
      gsap.to(o,{v:720,b:0,duration:1.5,ease:'back.out(0.7)',
        onUpdate:()=>{spin=o.v;wrap.style.filter=`blur(${o.b}px) drop-shadow(0 30px 40px rgba(0,0,0,.45))`},
        onComplete:()=>{spin=0;wrap.style.filter='drop-shadow(0 30px 40px rgba(0,0,0,.45))'}});
    }});
  let done=0;
  tops.forEach((el,i)=>{
    const r=el.getBoundingClientRect();
    const cx=innerWidth/2-el.offsetLeft-el.offsetWidth/2, cy=innerHeight/2-el.offsetTop-el.offsetHeight/2;
    const a=+el.dataset.angle, nx=(Math.random()-.5)*200, ny=(Math.random()-.5)*200;
    gsap.set(el,{rotation:a,x:+el.dataset.bx,y:+el.dataset.by});
    gsap.timeline()
      .to(el,{x:cx,y:cy,rotation:a+45,scale:.1,opacity:0,duration:.5,ease:'power2.in',onComplete:()=>{el.textContent=s.toppings[i]}})
      .to(el,{duration:.3})
      .to(el,{x:nx,y:ny,rotation:a+90,scale:1,opacity:i>=6?.65:1,duration:.9,ease:'back.out(1.5)',onComplete:()=>{
        el.dataset.angle=a+90; el.dataset.bx=nx; el.dataset.by=ny; el.dataset.rx=0; el.dataset.ry=0;
        gsap.set(el,{clearProps:'transform'});
        if(++done===tops.length) switching=false;
      }});
  });
}

document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{
  if(switching||c.classList.contains('on')) return;
  document.querySelectorAll('.card').forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); switchFlavor(c.dataset.flavor);
}));

/* HP potret: pusatkan gambar utama di antara judul dan kartu menu */
const mobileMQ=matchMedia('(max-width:900px) and (orientation:portrait),(max-width:520px)');
function placeStage(){
  if(!mobileMQ.matches){stage.style.removeProperty('--stage-top');stage.style.removeProperty('--wrap-w');return}
  const mainR=document.querySelector('main').getBoundingClientRect();
  const h1B=document.querySelector('.left h1').getBoundingClientRect().bottom;
  let low=document.querySelector('.right').getBoundingClientRect().top;
  document.querySelectorAll('.card .mini').forEach(m=>{low=Math.min(low,m.getBoundingClientRect().top)});
  const gap=low-h1B;
  stage.style.setProperty('--stage-top',((h1B+low)/2-mainR.top)+'px');
  stage.style.setProperty('--wrap-w',Math.max(120,Math.min(innerWidth*.48,gap/1.85))+'px');
}
placeStage();
addEventListener('resize',placeStage);addEventListener('orientationchange',()=>setTimeout(placeStage,250));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(placeStage);
setTimeout(placeStage,400);

/* uap naik */
const steam=document.getElementById('steam');
if(!reduce) setInterval(()=>{
  const p=document.createElement('div'); p.className='puff';
  const s=Math.random()*30+20; p.style.width=p.style.height=s+'px';
  p.style.left=Math.random()*100+'%';
  const d=Math.random()*6+5; p.style.animationDuration=d+'s';
  steam.appendChild(p); setTimeout(()=>p.remove(),d*1000);
},400);
</script>
</body>
</html>
